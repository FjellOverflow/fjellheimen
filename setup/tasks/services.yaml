---
- name: Set up Docker
  become: true
  block:
    - name: Add Docker repository
      ansible.builtin.yum_repository:
        name: docker
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/fedora/gpg

    - name: Create docker group with a fixed GID
      ansible.builtin.group:
        name: docker
        gid: 987
        system: true

    - name: Install Docker Engine
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Add docker group membership for {{ target_user }}
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Check reverse-proxy Docker network
      ansible.builtin.command: docker network inspect reverse-proxy
      register: docker_reverse_proxy_network
      changed_when: false
      failed_when: false

    - name: Ensure reverse-proxy Docker network exists
      ansible.builtin.command: >-
        docker network create reverse-proxy
      when: docker_reverse_proxy_network.rc != 0
      changed_when: true

- name: Set up Tailscale
  become: true
  block:
    - name: Add Tailscale repository
      ansible.builtin.yum_repository:
        name: tailscale
        description: Tailscale stable
        baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
        gpgcheck: true
        gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg

    - name: Install Tailscale
      ansible.builtin.dnf:
        name: tailscale

    - name: Enable and start Tailscale service
      ansible.builtin.service:
        name: tailscaled
        enabled: true
        state: started

- name: Set up SSH
  become: true
  block:
    # 01- sorts before Fedora's 40-/50-redhat drop-ins, and sshd keeps the first value it reads.
    - name: Set SSH password authentication off
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-fjellheimen.conf
        mode: "0600"
        content: |
          PasswordAuthentication no
      notify: Reload SSH daemon
