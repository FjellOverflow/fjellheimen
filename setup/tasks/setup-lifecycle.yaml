---
- name: Write lifecycle service
  become: true
  ansible.builtin.template:
    src: "templates/fjellheimen-lifecycle.service"
    dest: "/etc/systemd/system/fjellheimen-lifecycle.service"
    mode: "0644"

- name: Enable and start lifecycle service
  become: true
  ansible.builtin.systemd_service:
    name: fjellheimen-lifecycle.service
    daemon_reload: true
    enabled: true
    state: started
