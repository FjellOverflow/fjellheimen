---
- name: Add Docker repository
  become: true
  ansible.builtin.yum_repository:
    name: docker
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/fedora/gpg

- name: Install Docker Engine
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

- name: Add docker group membership for {{ target_user }}
  become: true
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: true

- name: Enable and start Docker service
  become: true
  ansible.builtin.service:
    name: "docker"
    enabled: true
    state: started

- name: Create reverse-proxy network
  become: true
  ansible.builtin.command: >-
    docker network create
    --subnet 172.20.0.0/16
    --ip-range 172.20.1.0/24
    reverse-proxy
  register: reverse_proxy_network
  changed_when: reverse_proxy_network.rc == 0
  failed_when: reverse_proxy_network.rc != 0 and 'already exists' not in reverse_proxy_network.stderr
