---
- name: Set up fjellheimen
  hosts: all
  pre_tasks:
    - name: Set up dnf Python bindings
      block:
        - name: Check dnf Python bindings # noqa: command-instead-of-module need to verify that modules have deps available
          ansible.builtin.command: rpm --query python3-libdnf5 python3-dnf
          register: dnf_bindings_installed
          changed_when: false
          failed_when: false

        - name: Install dnf Python bindings
          become: true
          # TODO: https://github.com/ansible-collections/community.general/issues/12501
          ansible.builtin.command: dnf install --assumeyes python3-libdnf5 python3-dnf
          when: dnf_bindings_installed.rc != 0
          changed_when: true

  tasks:
    - name: Set up base system
      ansible.builtin.import_tasks: tasks/base.yaml

    - name: Set up identity
      ansible.builtin.import_tasks: tasks/identity.yaml

    - name: Set up services
      ansible.builtin.import_tasks: tasks/services.yaml

    - name: Set up fjellheimen jobs
      ansible.builtin.import_tasks: tasks/fjellheimen.yaml

    - name: Set up sharing
      ansible.builtin.import_tasks: tasks/sharing.yaml

  handlers:
    - name: Restart Docker daemon
      become: true
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Reload SSH daemon
      become: true
      ansible.builtin.service:
        name: sshd
        state: reloaded

    - name: Restart Samba daemon
      become: true
      ansible.builtin.service:
        name: smb
        state: restarted

    - name: Restart Cockpit daemon
      become: true
      ansible.builtin.service:
        name: cockpit
        state: restarted
