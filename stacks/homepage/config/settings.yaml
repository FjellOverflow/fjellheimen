title: Fjellheimen
background:
  image: /assets/background.png
  blur: xs
  opacity: 15
hideErrors: true
statusStyle: dot
maxGroupColumns: 5
disableCollapse: true
bookmarksStyle: icons
useEqualHeights: true
layout:
  Library:
    header: false
    style: row
    columns: 2
    Media:
      icon: mdi-multimedia
      style: row
      columns: 3
    Photos:
      icon: mdi-image-multiple
      style: row
      columns: 3
  Media Management:
    icon: mdi-download-box
    style: row
    columns: 6
  Organization:
    icon: mdi-view-dashboard
    style: row
    columns: 6
  Utilities:
    header: false
    style: row
    columns: 3
    Files & Code:
      icon: mdi-folder-multiple
      style: row
      columns: 2
    Infrastructure:
      icon: mdi-account-wrench
      style: row
      columns: 2
    Monitoring:
      icon: mdi-chart-line
      style: row
      columns: 2
