name: uptime-kuma
services:
  uptime-kuma:
    image: ghcr.io/louislam/uptime-kuma:2.5.10
    container_name: uptime-kuma
    volumes:
      - /fjellheimen/data/uptime-kuma:/app/data
    networks:
      - reverse-proxy
    env_file:
      - /fjellheimen/stacks/.env
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: Host(`status.fjellhei.men`)
      traefik.http.routers.uptime-kuma.entrypoints: websecure
      traefik.http.routers.uptime-kuma.middlewares: voidauth@docker
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"
    healthcheck:
      test: curl --fail http://localhost:3001 || exit 1
      interval: 1m
      start_period: 20s
      timeout: 10s
      retries: 3
    restart: unless-stopped
networks:
  reverse-proxy:
    external: true
